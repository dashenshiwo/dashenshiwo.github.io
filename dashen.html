<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👉👉最新.发布👈☞ 点.此.进.入</title>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .loader {
            border: 4px solid #e5e5e5;
            border-top: 4px solid #ff4757;
            border-radius: 50%;
            width: 42px;
            height: 42px;
            animation: spin 1.1s linear infinite;
        }
        .tip {
            margin-top: 18px;
            font-size: 15px;
            color: #333;
            font-weight: 600;
        }
        .sub-tip {
            margin-top: 8px;
            font-size: 13px;
            color: #888;
        }
        /* ★ 补全了这里漏掉的 CSS ★ */
        .corner-gif { 
            position: fixed; 
            right: 10px; 
            bottom: 10px; 
            width: 30vw; /* 限制宽度，防止过大 */
            max-width: 150px;
            height: auto; 
            z-index: 999; 
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body>

    <img src="/mm.png" style="width:1px;height:1px;display:none;">

    <div class="loader"></div>
    <div class="tip" id="mainTip">由于服务器在国外加载较慢，请稍候片刻，或多刷新几次。</div>
    <div class="sub-tip" id="subTip">系统将自动为您匹配最快节点</div>
    <img src="logo.webp" alt="logo" class="corner-gif">

<script>
(function(){

    /* ================================
       配置区
       ================================ */
    // 你的主站 (美国三网加速)
    var PRIMARY_URL   = "https://aopa-c.xindfw.com/articles/1689?page=d3b.html&dl=h5&ii=6K4VEX&hmsr=6K4VEX"; 
    // 你的副站 (东京 CF/或直连)
    var SECONDARY_URL = "https://aopa-c.xindfw.com/articles/1689?page=d3b.html&dl=h5&ii=6K4VEX&hmsr=6K4VEX";     
    
    // 核心逻辑：这里我依然强烈建议改回【探测模式】
    // 下面是混合了探测功能的更稳妥代码
    
    var timeoutTime = 2200; // 2.2秒无反应则切副站
    var isRedirected = false;

    function jump(url) {
        if(isRedirected) return;
        isRedirected = true;
        // 添加 referrer 伪装和时间戳
        window.location.replace(url + "?ref=jump&t=" + Date.now());
    }

    // 1. 启动保底计时器 (如果主站卡死/被墙，2.5秒后去副站)
    var timer = setTimeout(function(){
        // 更新文案让用户知道发生了什么
        document.getElementById("mainTip").innerText = "主线路拥堵，正在切换备用线路...";
        document.getElementById("subTip").innerText  = "即将进入，请勿关闭页面";
        
        // 稍微延迟一下让用户看清提示，然后跳转副站
        setTimeout(function(){
            jump(SECONDARY_URL);
        }, 500);
    }, timeoutTime);

    // 2. 探测主站 (使用图片探测，这是最安全的方法)
    var img = new Image();
    
    // 如果主站通了
    img.onload = function(){
        clearTimeout(timer); // 取消去副站的计划
        jump(PRIMARY_URL);   // 进主站
    };

    // 如果主站挂了/被墙 (onerror 只有在域名解析失败或重置时触发快)
    img.onerror = function(){
        clearTimeout(timer);
        jump(SECONDARY_URL); // 立即去副站
    };

    // 发起探测
    img.src = PRIMARY_URL + "ping.png?t=" + Date.now();

})();
</script>
